<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">ABRL lemma dependency graph</title>
  <desc id="desc">A dependency graph connecting Mathlib-candidate infrastructure, bandit proof leaves, and application theorems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="165%">
      <feDropShadow dx="0" dy="11" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M 0 0 L 13 6.5 L 0 13 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1500" height="900" rx="24" fill="#fffaf3"/>
  <text x="48" y="78" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="900" fill="#111827">The lemma dependency graph behind ABRL formalization</text>
  <path d="M 0 130 L 590 130" stroke="#d97706" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="84" y="166" width="720" height="292" rx="28" fill="#eff6ff" stroke="#1d4ed8" stroke-width="5"/>
    <rect x="84" y="486" width="720" height="236" rx="28" fill="#fef2f2" stroke="#dc2626" stroke-width="5"/>
    <rect x="872" y="166" width="536" height="556" rx="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="5"/>
  </g>

  <text x="118" y="208" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="900" fill="#1e40af">Mathlib-candidate infrastructure</text>
  <text x="118" y="528" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="900" fill="#991b1b">Hidden regularity contracts</text>
  <text x="906" y="208" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="900" fill="#92400e">Bandit/RL theorem leaves and applications</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <rect x="132" y="250" width="220" height="82" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="160" y="282" font-size="18" font-weight="900" fill="#111827">Finite sums</text>
    <text x="160" y="308" font-size="12" fill="#475569">range, filter, reindex</text>

    <rect x="430" y="250" width="220" height="82" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="458" y="282" font-size="18" font-weight="900" fill="#111827">Argmax API</text>
    <text x="458" y="308" font-size="12" fill="#475569">finite maxima, ties</text>

    <rect x="278" y="358" width="220" height="82" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="306" y="390" font-size="18" font-weight="900" fill="#111827">Pull-count algebra</text>
    <text x="306" y="416" font-size="12" fill="#475569">monotone, split, count</text>

    <rect x="132" y="566" width="220" height="82" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <text x="160" y="598" font-size="18" font-weight="900" fill="#111827">Measurability</text>
    <text x="160" y="624" font-size="12" fill="#475569">history, actions, events</text>

    <rect x="430" y="566" width="220" height="82" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <text x="458" y="598" font-size="18" font-weight="900" fill="#111827">Integrability</text>
    <text x="458" y="624" font-size="12" fill="#475569">regret and counts</text>

    <rect x="278" y="662" width="220" height="82" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <text x="306" y="694" font-size="18" font-weight="900" fill="#111827">Concentration</text>
    <text x="306" y="720" font-size="12" fill="#475569">subGaussian, union bounds</text>

    <rect x="938" y="250" width="240" height="78" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="966" y="281" font-size="18" font-weight="900" fill="#111827">Regret decomposition</text>
    <text x="966" y="306" font-size="12" fill="#475569">generic theorem route</text>

    <rect x="1116" y="370" width="214" height="78" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="1144" y="401" font-size="18" font-weight="900" fill="#111827">UCB regret</text>
    <text x="1144" y="426" font-size="12" fill="#475569">index + good events</text>

    <rect x="938" y="486" width="214" height="78" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="966" y="517" font-size="18" font-weight="900" fill="#111827">ETC regret</text>
    <text x="966" y="542" font-size="12" fill="#475569">commit probability</text>

    <rect x="1116" y="604" width="214" height="78" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="1144" y="635" font-size="18" font-weight="900" fill="#111827">Thompson/Bayes</text>
    <text x="1144" y="660" font-size="12" fill="#475569">posterior confidence</text>
  </g>

  <g stroke="#6b7280" stroke-width="4.5" fill="none" marker-end="url(#arrow)">
    <path d="M 352 290 L 422 290"/>
    <path d="M 240 333 C 252 370, 270 382, 278 395"/>
    <path d="M 540 333 C 524 370, 506 383, 498 396"/>
    <path d="M 498 398 C 650 390, 804 316, 930 290"/>
    <path d="M 352 606 L 422 606"/>
    <path d="M 540 648 C 528 682, 510 694, 498 702"/>
    <path d="M 242 648 C 254 682, 270 694, 278 702"/>
    <path d="M 498 703 C 758 706, 966 660, 1108 644"/>
    <path d="M 498 703 C 770 666, 920 554, 930 528"/>
    <path d="M 498 703 C 812 604, 1092 460, 1110 414"/>
    <path d="M 1178 289 C 1210 318, 1222 348, 1223 362"/>
    <path d="M 1058 328 C 1050 396, 1048 452, 1047 478"/>
    <path d="M 1178 328 C 1225 456, 1228 566, 1226 596"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="90" y="788" width="1320" height="64" rx="18" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
    <text x="124" y="827" font-size="18" font-weight="900" fill="#1e3a8a">Infrastructure gap:</text>
    <text x="292" y="827" font-size="18" fill="#334155">Mathlib has broad foundations; ABRL turns repeated textbook proof leaves into explicit upstream-ready lemma nodes.</text>
  </g>
</svg>
