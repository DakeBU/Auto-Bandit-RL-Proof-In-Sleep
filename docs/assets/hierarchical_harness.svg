<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">ABRL hierarchical harness</title>
  <desc id="desc">Upper, middle, lower, and reviewer agents coordinate theorem targets, memory, proof leaves, and Lean checks.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.45" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow2" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="520" rx="28" fill="url(#bg2)"/>
  <text x="70" y="70" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800" fill="#0f172a">Hierarchical Harness</text>
  <text x="70" y="102" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#475569">A single coordinated stack keeps bandit literature, Lean targets, proof memory, and reviewer gates synchronized.</text>

  <g filter="url(#shadow2)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="80" y="145" width="230" height="110" rx="18" fill="#0f766e"/>
    <text x="110" y="185" font-size="22" font-weight="800" fill="#ffffff">Upper director</text>
    <text x="110" y="216" font-size="13" fill="#ccfbf1">theorem frontier</text>
    <text x="110" y="238" font-size="13" fill="#ccfbf1">route and capacity</text>

    <rect x="382" y="145" width="230" height="110" rx="18" fill="#2563eb"/>
    <text x="412" y="185" font-size="22" font-weight="800" fill="#ffffff">Middle curator</text>
    <text x="412" y="216" font-size="13" fill="#dbeafe">Lean/prose mapping</text>
    <text x="412" y="238" font-size="13" fill="#dbeafe">memory and ledgers</text>

    <rect x="684" y="145" width="230" height="110" rx="18" fill="#334155"/>
    <text x="714" y="185" font-size="22" font-weight="800" fill="#ffffff">Lower workers</text>
    <text x="714" y="216" font-size="13" fill="#e2e8f0">architect, Lean worker</text>
    <text x="714" y="238" font-size="13" fill="#e2e8f0">retrieval/search worker</text>

    <rect x="986" y="145" width="214" height="110" rx="18" fill="#b45309"/>
    <text x="1016" y="185" font-size="22" font-weight="800" fill="#ffffff">Reviewer</text>
    <text x="1016" y="216" font-size="13" fill="#ffedd5">target fidelity</text>
    <text x="1016" y="238" font-size="13" fill="#ffedd5">Lean gate</text>
  </g>

  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow2)">
    <path d="M 316 200 L 374 200"/>
    <path d="M 618 200 L 676 200"/>
    <path d="M 920 200 L 978 200"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="115" y="325" width="230" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="140" y="356" font-size="15" font-weight="800" fill="#0f172a">Task packet</text>
    <text x="140" y="380" font-size="13" fill="#475569">theorem, source, assumptions</text>

    <rect x="405" y="325" width="230" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="430" y="356" font-size="15" font-weight="800" fill="#0f172a">Conversion window</text>
    <text x="430" y="380" font-size="13" fill="#475569">symbols, Lean names, gaps</text>

    <rect x="695" y="325" width="230" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="720" y="356" font-size="15" font-weight="800" fill="#0f172a">Proof obligation DAG</text>
    <text x="720" y="380" font-size="13" fill="#475569">active leaves and blockers</text>

    <rect x="985" y="325" width="230" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1010" y="356" font-size="15" font-weight="800" fill="#0f172a">Certified memory</text>
    <text x="1010" y="380" font-size="13" fill="#475569">compiled theorem or rejection</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow2)">
    <path d="M 230 255 L 230 318"/>
    <path d="M 520 255 L 520 318"/>
    <path d="M 810 255 L 810 318"/>
    <path d="M 1093 255 L 1093 318"/>
    <path d="M 345 364 L 397 364"/>
    <path d="M 635 364 L 687 364"/>
    <path d="M 925 364 L 977 364"/>
  </g>

  <path d="M 1092 420 C 900 480, 428 480, 197 420" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow2)"/>
  <text x="480" y="468" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e">review feedback compresses into next-cycle memory</text>
</svg>
