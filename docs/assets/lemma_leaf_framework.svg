<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
  <title id="title">ABRL Mathlib-ready lemma leaf framework</title>
  <desc id="desc">A framework diagram showing the finite-arm regret target decomposed into reusable Lean lemma leaves, regularity contracts, algorithm control, and concentration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eefcfb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-24%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M 0 0 L 13 6.5 L 0 13 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1500" height="880" rx="24" fill="#f8fafc"/>
  <rect x="0" y="0" width="1500" height="132" fill="#ffffff" opacity="0.86"/>
  <text x="48" y="78" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="900" fill="#111827">Target:</text>
  <text x="210" y="78" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="900" fill="#dc2626">Mathlib-ready</text>
  <text x="496" y="78" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="900" fill="#111827">finite-arm regret proof framework</text>
  <path d="M 0 130 L 430 130" stroke="#d97706" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="118" y="176" width="870" height="108" rx="20" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
  </g>
  <text x="156" y="220" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#111827">
    Regret(T) = sum_a gap(a) * E[pulls(a,T)]
  </text>
  <text x="156" y="253" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">
    &lt;= pull-count control + confidence terms
  </text>
  <text x="156" y="276" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6b7280">
    Root theorem is never attacked flat; lower agents discharge the reusable leaves below.
  </text>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="92" y="348" width="520" height="386" rx="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/>
    <rect x="650" y="348" width="300" height="386" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="4"/>
    <rect x="998" y="348" width="390" height="386" rx="22" fill="#fef2f2" stroke="#dc2626" stroke-width="4"/>
  </g>

  <text x="120" y="388" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="900" fill="#1e40af">Capacity and bookkeeping leaves</text>
  <text x="678" y="388" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="900" fill="#92400e">Algorithm-control leaves</text>
  <text x="1026" y="388" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="900" fill="#991b1b">Regularity and concentration leaves</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <rect x="138" y="430" width="198" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="162" y="457" font-size="17" font-weight="800" fill="#111827">Finite index API</text>
    <text x="162" y="480" font-size="12" fill="#475569">Finset, range, sums</text>

    <rect x="372" y="430" width="198" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="396" y="457" font-size="17" font-weight="800" fill="#111827">Pull count algebra</text>
    <text x="396" y="480" font-size="12" fill="#475569">N_a(t+1), monotonicity</text>

    <rect x="180" y="548" width="350" height="82" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
    <text x="210" y="581" font-size="20" font-weight="900" fill="#111827">Regret decomposition</text>
    <text x="210" y="609" font-size="13" fill="#475569">Σ gaps over time ↔ Σ gaps times pulls</text>

    <rect x="216" y="670" width="278" height="52" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
    <text x="242" y="702" font-size="17" font-weight="800" fill="#0f172a">Mathlib-candidate core lemmas</text>

    <rect x="698" y="430" width="204" height="64" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="728" y="457" font-size="17" font-weight="800" fill="#111827">UCB index max</text>
    <text x="728" y="480" font-size="12" fill="#475569">argmax and width</text>

    <rect x="698" y="526" width="204" height="64" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="728" y="553" font-size="17" font-weight="800" fill="#111827">ETC commit</text>
    <text x="728" y="576" font-size="12" fill="#475569">round-robin then argmax</text>

    <rect x="698" y="622" width="204" height="64" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="728" y="649" font-size="17" font-weight="800" fill="#111827">TS posterior</text>
    <text x="728" y="672" font-size="12" fill="#475569">best-action distribution</text>

    <rect x="1042" y="430" width="300" height="64" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <text x="1072" y="457" font-size="17" font-weight="800" fill="#111827">Measurability and integrability</text>
    <text x="1072" y="480" font-size="12" fill="#475569">promote hidden regularity to contracts</text>

    <rect x="1042" y="526" width="300" height="64" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <text x="1072" y="553" font-size="17" font-weight="800" fill="#111827">Sub-Gaussian tail lemmas</text>
    <text x="1072" y="576" font-size="12" fill="#475569">MGF, Hoeffding, union bounds</text>

    <rect x="1042" y="622" width="300" height="64" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <text x="1072" y="649" font-size="17" font-weight="800" fill="#111827">Persistence failure audit</text>
    <text x="1072" y="672" font-size="12" fill="#475569">missing assumption or counterexample</text>
  </g>

  <g stroke="#6b7280" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M 238 494 L 300 545"/>
    <path d="M 472 494 L 420 545"/>
    <path d="M 354 630 L 354 662"/>
    <path d="M 532 588 L 690 462"/>
    <path d="M 532 588 L 690 558"/>
    <path d="M 532 588 L 690 654"/>
    <path d="M 904 462 L 1034 462"/>
    <path d="M 904 558 L 1034 558"/>
    <path d="M 904 654 L 1034 654"/>
    <path d="M 1190 430 C 1170 292, 862 270, 835 283"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="108" y="774" width="1272" height="58" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="138" y="810" font-size="18" font-weight="900" fill="#0f172a">Rule:</text>
    <text x="194" y="810" font-size="18" fill="#334155">each leaf records statement, API, proof route, hidden regularity, failure signal, and Mathlib candidacy before lower-agent tactic work.</text>
  </g>
</svg>
