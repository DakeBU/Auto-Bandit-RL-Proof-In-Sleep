<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">ABRL Lean module layout</title>
  <desc id="desc">Current public Lean module structure and its connection to harness memory and Mathlib-ready lemma leaves.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1500" height="900" rx="24" fill="#ffffff"/>
  <text x="48" y="78" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="900" fill="#111827">Layout</text>
  <path d="M 48 120 L 1390 120" stroke="#e2e8f0" stroke-width="3"/>
  <text x="48" y="180" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" fill="#1f2937">Current public Lean modules and proof-memory edges for Mathlib-ready leaf work.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <rect x="615" y="236" width="270" height="48" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="650" y="267" font-size="17" font-weight="800" fill="#0f172a">BanditRLProof.Core</text>

    <rect x="615" y="338" width="270" height="48" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="646" y="369" font-size="17" font-weight="800" fill="#0f172a">BanditRLProof.Regret</text>

    <rect x="220" y="470" width="290" height="48" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="250" y="501" font-size="16" font-weight="800" fill="#0f172a">BanditRLProof.Algorithms.ETC</text>

    <rect x="602" y="470" width="296" height="48" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="634" y="501" font-size="16" font-weight="800" fill="#0f172a">BanditRLProof.Algorithms.UCB</text>

    <rect x="990" y="470" width="330" height="48" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="1020" y="501" font-size="16" font-weight="800" fill="#0f172a">BanditRLProof.Algorithms.Thompson</text>

    <rect x="600" y="604" width="300" height="48" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="638" y="635" font-size="17" font-weight="800" fill="#0f172a">BanditRLProof.Literature</text>

    <rect x="240" y="706" width="280" height="48" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="275" y="737" font-size="17" font-weight="800" fill="#0f172a">BanditRLProof.Automation</text>

    <rect x="610" y="706" width="280" height="48" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="650" y="737" font-size="17" font-weight="800" fill="#0f172a">BanditRLProof.OpenProblems</text>

    <rect x="980" y="706" width="260" height="48" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="1034" y="737" font-size="17" font-weight="800" fill="#0f172a">BanditRLProof</text>

    <rect x="616" y="808" width="268" height="48" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="704" y="839" font-size="17" font-weight="900" fill="#1e1b4b">Tests</text>

    <rect x="76" y="314" width="330" height="70" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-dasharray="10 7" stroke-width="3"/>
    <text x="108" y="346" font-size="17" font-weight="900" fill="#92400e">research-wiki/mathlib-candidates</text>
    <text x="108" y="370" font-size="12" fill="#92400e">general leaf lemmas proposed for upstream</text>

    <rect x="1070" y="314" width="330" height="70" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="10 7" stroke-width="3"/>
    <text x="1102" y="346" font-size="17" font-weight="900" fill="#991b1b">proof-obligations / attempts</text>
    <text x="1102" y="370" font-size="12" fill="#991b1b">route stability and failure signal</text>
  </g>

  <g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M 750 284 L 750 330"/>
    <path d="M 702 386 L 384 462"/>
    <path d="M 750 386 L 750 462"/>
    <path d="M 798 386 L 1148 462"/>
    <path d="M 365 518 L 690 598"/>
    <path d="M 750 518 L 750 596"/>
    <path d="M 1155 518 L 812 598"/>
    <path d="M 690 652 L 430 700"/>
    <path d="M 750 652 L 750 698"/>
    <path d="M 812 652 L 1052 700"/>
    <path d="M 1110 754 L 820 804"/>
    <path d="M 750 754 L 750 800"/>
    <path d="M 380 754 L 680 804"/>
  </g>

  <g stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow)">
    <path d="M 406 350 C 494 300, 560 275, 607 264"/>
    <path d="M 406 350 C 512 398, 556 456, 594 486"/>
  </g>
  <g stroke="#dc2626" stroke-width="3" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow)">
    <path d="M 1070 350 C 980 300, 928 276, 893 264"/>
    <path d="M 1070 350 C 992 398, 938 456, 906 486"/>
  </g>

  <text x="92" y="850" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#475569">Dashed edges are harness-memory edges; solid edges are Lean import or aggregation direction.</text>
</svg>
