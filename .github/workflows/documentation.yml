name: Lean and documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          # Target-drift provenance tests reconstruct the frozen pre-audit
          # workspace commit; a depth-1 PR checkout omits that Git object.
          fetch-depth: 0

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build the Lean library and tests
        run: python3 tools/bandit.py check

      - name: Validate result-free evaluation protocols
        run: |
          python3 tools/validate_target_drift_suite_v2.py
          python3 tools/validate_target_drift_external_comparator.py

      - name: Build the literate formalization website
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            python3 website/scripts/build_site.py \
              --lean-verified \
              --public-snapshot-base-url https://dakebu.github.io/Auto-Bandit-RL-Proof-In-Sleep
          else
            python3 website/scripts/build_site.py --lean-verified
          fi

      - name: Check links, mappings, formulas, and diagrams
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            python3 website/scripts/check_site.py \
              --expect-public-base-url https://dakebu.github.io/Auto-Bandit-RL-Proof-In-Sleep
          else
            python3 website/scripts/check_site.py
          fi

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
