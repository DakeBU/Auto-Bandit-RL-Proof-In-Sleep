name: Target-drift checker image

on:
  workflow_dispatch:
    inputs:
      workspace_base_commit:
        description: Frozen pre-audit workspace commit
        required: true
        default: d43bfeee56fb0c1c35cf5af9fc1a7fdc3e0c37b9
      lean_base_image:
        description: Digest-pinned trusted builder/runtime base
        required: true
        default: ghcr.io/leanprover-community/mathlib4/gitpod@sha256:3fd7d678a320db6a6a919ab909fe3dea8e7e92ff0ea5678681ae8cbc490d5e9e

permissions:
  contents: read

concurrency:
  group: target-drift-checker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKSPACE_BASE_COMMIT: ${{ inputs.workspace_base_commit || 'd43bfeee56fb0c1c35cf5af9fc1a7fdc3e0c37b9' }}
      LEAN_BASE_IMAGE: ${{ inputs.lean_base_image || 'ghcr.io/leanprover-community/mathlib4/gitpod@sha256:3fd7d678a320db6a6a919ab909fe3dea8e7e92ff0ea5678681ae8cbc490d5e9e' }}
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate the checker-image component gate
        run: python3 -m unittest tools.test_target_drift_runtime

      - name: Prepare the frozen image context
        run: |
          python3 tools/prepare_target_drift_checker_image.py prepare-context \
            --workspace-base-commit "${WORKSPACE_BASE_COMMIT}" \
            --lean-base-image "${LEAN_BASE_IMAGE}" \
            --output "${RUNNER_TEMP}/abrl-checker-context"
          python3 tools/prepare_target_drift_checker_image.py verify-context \
            --context "${RUNNER_TEMP}/abrl-checker-context"

      - name: Build and attest the candidate image
        run: |
          mkdir -p "${RUNNER_TEMP}/abrl-checker-artifacts"
          python3 tools/prepare_target_drift_checker_image.py build-image \
            --context "${RUNNER_TEMP}/abrl-checker-context" \
            --image-tag "abrl-target-drift-checker:${GITHUB_RUN_ID}" \
            --sbom-output "${RUNNER_TEMP}/abrl-checker-artifacts/checker-image-sbom.json" \
            --cache-manifest-output "${RUNNER_TEMP}/abrl-checker-artifacts/checker-cache-manifest.json" \
            --build-log "${RUNNER_TEMP}/abrl-checker-artifacts/checker-image-build.log"
          cp "${RUNNER_TEMP}/abrl-checker-context/checker-image-build-input.json" \
            "${RUNNER_TEMP}/abrl-checker-artifacts/checker-image-build-input.json"

      - name: Bind the candidate runtime and pass all seven isolation probes
        run: |
          set -o pipefail
          python3 tools/prepare_target_drift_checker_probe_config.py \
            --template evaluation/target-drift-v2/execution-template.json \
            --context "${RUNNER_TEMP}/abrl-checker-context" \
            --artifact-dir "${RUNNER_TEMP}/abrl-checker-artifacts" \
            --probe-report "${RUNNER_TEMP}/abrl-checker-artifacts/checker-isolation-probe.json" \
            --probe-artifacts-dir "${RUNNER_TEMP}/abrl-checker-artifacts/checker-isolation-probe-artifacts" \
            --output "${RUNNER_TEMP}/abrl-checker-artifacts/checker-probe-draft.json" \
            --wall-clock-seconds 900 \
            --memory-mb 8192 \
            --pids-limit 256 \
            --cpus 2 \
            --maximum-output-bytes 16777216 \
            --maximum-response-bytes 4194304
          python3 tools/finalize_target_drift_config.py bind-runtime \
            --draft "${RUNNER_TEMP}/abrl-checker-artifacts/checker-probe-draft.json" \
            --runtime-executable "$(command -v docker)" \
            --output "${RUNNER_TEMP}/abrl-checker-artifacts/checker-runtime-bound.json"
          python3 tools/record_target_drift_checker_isolation_probe.py \
            --config "${RUNNER_TEMP}/abrl-checker-artifacts/checker-runtime-bound.json" \
            --work-dir "${RUNNER_TEMP}/abrl-checker-probe-work" \
            --output "${RUNNER_TEMP}/abrl-checker-artifacts/checker-isolation-probe.json" \
            --probe-commit "${GITHUB_SHA}" \
            --host-platform "$(uname -srmo)" \
            2>&1 | tee "${RUNNER_TEMP}/abrl-checker-artifacts/checker-isolation-probe-attempt.log"

      - name: Upload the result-free build and isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-drift-checker-image-${{ github.run_id }}
          path: ${{ runner.temp }}/abrl-checker-artifacts
          if-no-files-found: warn
          retention-days: 14
