name: Lemma / theorem proposal
description: Propose a sourced Bandit/RL result, reusable interface, source correction, or frontier theorem target.
title: "[Lemma] "
labels: ["lemma proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Before substantial work, read AGENTS.md, CONTRIBUTING.md, docs/contributor-codex-contract.md, and docs/theorem-publication-protocol.md. A proposal is not proved, source-faithful, route-complete, or integrated until the corresponding independent evidence exists.
  - type: input
    id: route
    attributes:
      label: Route / frontier
      description: Name the teaching route, BanditRLwiki setting/case/frontier, shared foundation, or other canonical owner.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Exact source and locator
      description: Give paper/book title, version, URL/DOI/arXiv, theorem/lemma/section/page, or explicitly state original result/internal design.
    validations:
      required: true
  - type: textarea
    id: plain
    attributes:
      label: Plain mathematical statement
      description: State the theorem accurately for a mathematically trained reader outside the immediate subfield.
    validations:
      required: true
  - type: textarea
    id: latex
    attributes:
      label: Mathematical statement in LaTeX
      render: latex
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions, conventions, and truth boundary
      description: Include quantifiers, reward/feedback model, horizon/stopping semantics, probability mode, measurability/integrability/independence, constants, and regimes the claim does not cover.
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Reuse / shared-floor audit
      description: List BanditRLlib, Mathlib, LML, and compatible upstream declarations/regions searched; classify reuse/adapt/missing; identify at least two consumers if proposing a new shared lemma.
    validations:
      required: true
  - type: textarea
    id: lean
    attributes:
      label: Lean signature or draft
      description: Optional at proposal time. Include intended module/imports and compiler diagnostics if available.
      render: lean
  - type: textarea
    id: reader
    attributes:
      label: Reader/publication plan
      description: Which source-aligned chapter/case/frontier page should show the source statement, natural-language formula proof, hidden assumptions, folded Lean, dependencies, and remaining boundary?
    validations:
      required: true
  - type: textarea
    id: semantic
    attributes:
      label: Encoder–denoiser semantic plan
      description: For source-facing work, name how a source-blind decoder and distinct anti-anchored source reviewer will be used. The formalizer cannot self-certify source fidelity.
    validations:
      required: true
  - type: textarea
    id: graphs
    attributes:
      label: Lean Graph / Overview / Functor Hypergraph delta
      description: State expected Lean graph placement, route/progress update, and whether the Functor Hypergraph audit is none-found-with-reason, candidate-published, or stabilized. Conceptual edges are never solid Lean dependencies.
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Preferred contributor credit
      description: Name and optional affiliation, ORCID, or profile link.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Contribution confirmations
      options:
        - label: I will follow the repository-local Codex/contributor contract rather than an older copied chat prompt.
          required: true
        - label: I have searched for reusable existing declarations before proposing route-local duplicates.
          required: true
        - label: I will not describe an uncompiled draft, incomplete semantic audit, or partial route as integrated/complete.
          required: true
        - label: I have the right to submit this material and license my intentional contribution under MIT.
          required: true
        - label: I have not included credentials, private review material, or sensitive personal information.
          required: true
